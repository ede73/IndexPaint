name: Android CI

on:
  pull_request:
    branches: [main]
  pull_request_target:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out pull request code (untrusted code stays on GitHub-hosted runner)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Run unit tests, instrumentation tests, and unsigned debug build
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          script: ./gradlew --no-daemon testDebugUnitTest connectedDebugAndroidTest assembleDebug

  runner-signing-smoke:
    # Temporary pre-merge test. Removed after the Mac runner/policy check.
    if: github.actor == 'ede73' && github.triggering_actor == 'ede73' && github.event_name == 'pull_request'
    runs-on: [self-hosted, macOS, indexpaint-release]
    timeout-minutes: 20
    steps:
      - name: Check out PR source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Materialize signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.INDEXPAINT_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "indexpaint-upload.jks"
          path.write_bytes(base64.b64decode(os.environ["KEYSTORE_BASE64"], validate=True))
          path.chmod(0o600)
          PY

      - name: Verify signing key and alias on the Mac mini
        env:
          INDEXPAINT_KEYSTORE_PATH: ${{ runner.temp }}/indexpaint-upload.jks
          INDEXPAINT_KEYSTORE_TYPE: ${{ vars.INDEXPAINT_KEYSTORE_TYPE }}
          INDEXPAINT_KEY_ALIAS: ${{ vars.INDEXPAINT_KEY_ALIAS }}
          INDEXPAINT_KEYSTORE_PASSWORD: ${{ secrets.INDEXPAINT_KEYSTORE_PASSWORD }}
          INDEXPAINT_KEY_PASSWORD: ${{ secrets.INDEXPAINT_KEY_PASSWORD }}
          ANDROID_HOME: /Users/ede/Library/Android/sdk
          ANDROID_SDK_ROOT: /Users/ede/Library/Android/sdk
        run: ./gradlew --no-daemon verifyReleaseSigning

      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/indexpaint-upload.jks"
