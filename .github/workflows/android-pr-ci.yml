name: Android CI

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Keep the emulator on the runner image generation that has working KVM
    # support for this setup. ubuntu-latest moved to 26.04 and the emulator
    # stayed offline during boot on that image.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out pull request code (untrusted code stays on GitHub-hosted runner)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run unit tests, instrumentation tests, and unsigned debug build
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: ./gradlew --no-daemon testDebugUnitTest connectedDebugAndroidTest assembleDebug
