name: Android Mac mini build

on:
  workflow_dispatch:
    inputs:
      publish_internal:
        description: Publish the signed bundle to Google Play Internal testing
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: android-release-build
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, macOS]
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Materialize upload keystore from signing bundle
        shell: bash
        env:
          INDEXPAINT_SIGNING_BUNDLE: ${{ secrets.INDEXPAINT_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          : "${INDEXPAINT_SIGNING_BUNDLE:?Missing INDEXPAINT_SIGNING_BUNDLE repository secret}"
          IFS=$'\n' read -r keystore_b64 store_password key_password key_alias keystore_type <<< "$INDEXPAINT_SIGNING_BUNDLE"
          : "${keystore_b64:?Signing bundle is missing the keystore data}"
          : "${store_password:?Signing bundle is missing the store password}"
          : "${key_password:?Signing bundle is missing the key password}"
          : "${key_alias:?Signing bundle is missing the key alias}"
          : "${keystore_type:?Signing bundle is missing the keystore type}"
          printf '::add-mask::%s\n' "$keystore_b64" "$store_password" "$key_password"
          keystore_path="$RUNNER_TEMP/indexpaint-upload.jks"
          printf '%s' "$keystore_b64" | base64 -D > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "INDEXPAINT_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
          echo "INDEXPAINT_KEY_ALIAS=$key_alias" >> "$GITHUB_ENV"
          echo "INDEXPAINT_KEYSTORE_TYPE=$keystore_type" >> "$GITHUB_ENV"

      - name: Build signed AAB
        if: ${{ !inputs.publish_internal }}
        shell: bash
        env:
          INDEXPAINT_SIGNING_BUNDLE: ${{ secrets.INDEXPAINT_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          IFS=$'\n' read -r _ store_password key_password _ _ <<< "$INDEXPAINT_SIGNING_BUNDLE"
          printf '::add-mask::%s\n' "$store_password" "$key_password"
          INDEXPAINT_KEYSTORE_PASSWORD="$store_password" INDEXPAINT_KEY_PASSWORD="$key_password" ./gradlew --no-daemon generateSignedBundle

      - name: Publish to Internal testing
        if: ${{ inputs.publish_internal }}
        shell: bash
        env:
          INDEXPAINT_SIGNING_BUNDLE: ${{ secrets.INDEXPAINT_SIGNING_BUNDLE }}
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
        run: |
          set -euo pipefail
          IFS=$'\n' read -r _ store_password key_password _ _ <<< "$INDEXPAINT_SIGNING_BUNDLE"
          printf '::add-mask::%s\n' "$store_password" "$key_password"
          INDEXPAINT_KEYSTORE_PASSWORD="$store_password" INDEXPAINT_KEY_PASSWORD="$key_password" ./gradlew --no-daemon publishInternal

      - name: Upload signed bundle for phone download
        uses: actions/upload-artifact@v4
        with:
          name: indexpaint-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing files and workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/indexpaint-upload.jks"
          case "$GITHUB_WORKSPACE" in
            "$RUNNER_WORKSPACE"/*) rm -rf -- "$GITHUB_WORKSPACE" ;;
            *) echo "Refusing to remove workspace outside runner work directory." >&2; exit 1 ;;
          esac
