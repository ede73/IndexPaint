<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IndexPaint responsive design</title><style>body{margin:0;background:#eaf0ef;color:#20333d;font:16px system-ui, sans-serif}header{padding:28px 32px 12px}h1{margin:0 0 8px;font-size:28px}p{margin:0;color:#63737c}.grid{display:grid;grid-template-columns:minmax(260px,390px) minmax(360px,844px);gap:24px;padding:20px 32px 40px;align-items:start}.tablet{grid-column:1/-1}.card{background:#fffdf8;border:1px solid #d5dfdd;border-radius:20px;padding:16px;box-shadow:0 12px 34px #20333d14}.card h2{margin:0 0 12px;font-size:17px}.card img{display:block;width:100%;height:auto;border-radius:14px}.tablet img{max-width:100%;max-height:640px;object-fit:contain;background:#f4f6f5}.phone-landscape img{max-height:320px;object-fit:contain;background:#f4f6f5}@media(max-width:780px){.grid{grid-template-columns:1fr;padding:14px}.tablet{grid-column:auto}}</style><header><h1>IndexPaint · responsive drawing tools</h1><p>Four separately importable artboards. Phone layouts keep controls compact; tablets use the available room for readable labels.</p></header><main class="grid"><section class="card phone-portrait"><h2>Phone · Portrait</h2><img src="phone-portrait.svg"></section><section class="card phone-landscape"><h2>Phone · Landscape</h2><img src="phone-landscape.svg"></section><section class="card tablet"><h2>Tablet · Portrait</h2><img src="tablet-portrait.svg"></section><section class="card tablet"><h2>Tablet · Landscape</h2><img src="tablet-landscape.svg"></section></main></html>
